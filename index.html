<!DOCTYPE html>
<html lang="en">
<head>

      border: 1px solid rgba(153,179,212,0.9);

      color: #99b3d4;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;

      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      opacity: 0.9;
    }
    .dot {
